{% extends 'base.html' %}{% block title %}Ingresar · Gamarra Conecta{% endblock %}
{% block content %}
<div class="form-page">
  <p class="eyebrow">Bienvenido</p>
  <h1>Ingresar</h1>
  <p>Accede para gestionar tu negocio y tus solicitudes.</p>
  <form method="post" class="card form" novalidate>
    <input type="hidden" name="_csrf" value="{{ csrf_token }}">
    <div class="field-group"><label for="email">Correo electrónico</label><input id="email" type="email" name="email" required autocomplete="email" value="{{ request.form.get('email','') }}"></div>
    <div class="field-group"><label for="password">Contraseña</label><input id="password" type="password" name="password" required autocomplete="current-password"></div>
    <button class="button" type="submit">Ingresar</button>
  </form>
  <p class="alt-link">¿Aún no tienes cuenta? <a href="{{ url_for('register') }}">Crear cuenta</a></p>
</div>
{% endblock %}
