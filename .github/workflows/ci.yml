name: CI y seguridad
on:
  push:
  pull_request:
jobs:
  calidad:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar aplicación y analizadores
        run: python -m pip install -r requirements.txt bandit pip-audit
      - name: Compilar módulos
        run: python -m compileall -q app.py tests
      - name: Ejecutar pruebas automatizadas
        run: python -m unittest discover -s tests -v
      - name: Analizar código Python con Bandit
        run: bandit -r app.py -ll
      - name: Auditar dependencias
        run: pip-audit -r requirements.txt
